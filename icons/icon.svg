<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer clipboard body -->
  <g filter="url(#shadow)">
    <rect x="96" y="80" width="320" height="370" rx="32" fill="url(#clipGrad)" stroke="#334155" stroke-width="4" />
    
    <!-- Clipboard top clip -->
    <rect x="186" y="52" width="140" height="56" rx="16" fill="#475569" stroke="#64748b" stroke-width="3" />
    <circle cx="256" cy="80" r="12" fill="#0f172a" />
  </g>

  <!-- Content lines inside clipboard -->
  <!-- Row 1: Checkmark + Bar -->
  <circle cx="150" cy="180" r="18" fill="url(#accentGrad)" />
  <path d="M141 180 l6 6 l13 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="190" y="171" width="180" height="18" rx="9" fill="#334155" />

  <!-- Row 2: Checkmark + Bar -->
  <circle cx="150" cy="245" r="18" fill="url(#accentGrad)" />
  <path d="M141 245 l6 6 l13 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="190" y="236" width="140" height="18" rx="9" fill="#334155" />

  <!-- Row 3: Trophy / Star badge -->
  <circle cx="150" cy="310" r="18" fill="#fbbf24" />
  <path d="M144 310 l4 -4 l4 4 l-1.5 6 l-6.5 -3.5 l-6.5 3.5 z" fill="#78350f" />
  <rect x="190" y="301" width="200" height="18" rx="9" fill="#334155" />

  <!-- Row 4: Stats Mini Graph -->
  <rect x="140" y="365" width="232" height="42" rx="10" fill="#0b1324" />
  <!-- Bar 1 -->
  <rect x="160" y="380" width="18" height="20" rx="4" fill="#38bdf8" />
  <!-- Bar 2 -->
  <rect x="195" y="372" width="18" height="28" rx="4" fill="#38bdf8" />
  <!-- Bar 3 (Tallest) -->
  <rect x="230" y="368" width="18" height="32" rx="4" fill="#34d399" />
  <!-- Bar 4 -->
  <rect x="265" y="376" width="18" height="24" rx="4" fill="#38bdf8" />
  <!-- Bar 5 -->
  <rect x="300" y="384" width="18" height="16" rx="4" fill="#64748b" />
  <!-- Bar 6 -->
  <rect x="335" y="374" width="18" height="26" rx="4" fill="#38bdf8" />
</svg>
